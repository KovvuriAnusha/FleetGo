<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- FleetGo mark: a delivery van in motion. Original artwork. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g fill="#FFFFFF">
        <!-- motion lines -->
        <rect x="54" y="188" width="52" height="14" rx="7" />
        <rect x="34" y="224" width="72" height="14" rx="7" />
        <rect x="60" y="260" width="46" height="14" rx="7" />
        <!-- cargo body -->
        <rect x="118" y="164" width="154" height="118" rx="18" />
        <!-- cab with window cut out -->
        <path fill-rule="evenodd" d="M272 200 h48 l40 46 v36 h-88 z M288 214 h26 l26 30 h-52 z" />
        <!-- wheels -->
        <path fill-rule="evenodd" d="M176 298 m-34,0 a34,34 0 1,0 68,0 a34,34 0 1,0 -68,0 M176 298 m-15,0 a15,15 0 1,0 30,0 a15,15 0 1,0 -30,0" />
        <path fill-rule="evenodd" d="M318 298 m-34,0 a34,34 0 1,0 68,0 a34,34 0 1,0 -68,0 M318 298 m-15,0 a15,15 0 1,0 30,0 a15,15 0 1,0 -30,0" />
    </g>
</svg>
