name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (API, Shared)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The .NET MAUI heads are built on developer machines and on a macOS runner
      # in a later phase - they need the MAUI workloads plus platform SDKs, which
      # would slow this check down considerably. Everything the mobile app relies
      # on that is not platform-specific lives in FleetGo.Shared and is covered here.
      - name: Restore
        run: |
          dotnet restore tests/FleetGo.API.Tests/FleetGo.API.Tests.csproj
          dotnet restore tests/FleetGo.Mobile.Tests/FleetGo.Mobile.Tests.csproj

      - name: Build
        run: |
          dotnet build tests/FleetGo.API.Tests/FleetGo.API.Tests.csproj --configuration Release --no-restore
          dotnet build tests/FleetGo.Mobile.Tests/FleetGo.Mobile.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test tests/FleetGo.API.Tests/FleetGo.API.Tests.csproj --configuration Release --no-build --verbosity normal
          dotnet test tests/FleetGo.Mobile.Tests/FleetGo.Mobile.Tests.csproj --configuration Release --no-build --verbosity normal
